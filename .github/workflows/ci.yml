name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Track go.mod rather than pinning here, so the version can't drift.
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The official installer, so there's no third-party action tag to keep
      # current. CI deliberately runs the same `just` recipes a developer does —
      # if the two drift, the recipes are what's wrong.
      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # install-only: the action installs and caches the binary, but `just
      # check-ci` is what runs it — CI must exercise the same recipe a
      # developer does, or the two drift.
      #
      # This version is the one that gates merges. Homebrew tracks latest, so a
      # local golangci-lint can be newer; when they disagree, this pin wins and
      # the Brewfile says how to match it locally.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Verify-only: fails if gofmt, golangci-lint, oxfmt, oxlint, the
      # type-checker, or `go mod tidy -diff` would change anything or object.
      # Writes nothing.
      - name: Check (format, lint, types, module graph)
        run: just check-ci

      # The full suite, including the e2e tests that build and spawn the binary
      # (kill -9 resume, graceful restart, dup submit, workspace loss).
      - name: Test
        run: just test-full
