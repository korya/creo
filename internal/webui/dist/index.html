<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Creo — build your website</title>
    <style>
      :root { --bg: #f4f1ea; --ink: #2b2620; --accent: #b5651d; --panel: #fffdf8; --line: #e3ddce; }
      /* Three type tiers only, ~1.35 ratio apart: brand 22 / content 15 / meta 12. */
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; color: var(--ink); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
      header { padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 16px; }
      header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
      header .grow { flex: 1; }
      header input { font-family: monospace; font-size: 12px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; width: 240px; }
      #status { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8272; }
      main { flex: 1; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
      #chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
      #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .msg { padding: 9px 12px; border-radius: 10px; max-width: 92%; line-height: 1.45; white-space: pre-wrap; }
      .msg.you { align-self: flex-end; background: var(--accent); color: #fff; }
      .msg.creo { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
      .msg.system { align-self: center; font-size: 12px; color: #8a8272; font-style: italic; }
      #composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; }
      #input { flex: 1; resize: none; height: 54px; padding: 8px; font-family: inherit; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; }
      button { font-family: inherit; font-size: 15px; padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      #preview-pane { display: flex; flex-direction: column; min-height: 0; }
      #preview-bar { padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #8a8272; }
      #preview-bar .grow { flex: 1; }
      #live { color: var(--accent); }
      #preview-body { position: relative; flex: 1; }
      iframe#preview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
      /* Transient build-progress line (never part of the transcript). */
      .activity { align-self: flex-start; padding: 8px 12px; font-size: 12px; color: #8a8272; font-style: italic; }
      .activity::after { content: ""; }
      @keyframes creo-pulse { 0%,100% { opacity: 0.35 } 50% { opacity: 1 } }
      .activity { animation: creo-pulse 1.4s ease-in-out infinite; }
      /* Preview "building" overlay — replaces the blank white during a run. */
      #preview-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: var(--bg); color: #8a8272; font-size: 15px; z-index: 2; }
      #preview-pane.building #preview-overlay { display: flex; animation: creo-pulse 1.4s ease-in-out infinite; }
    </style>
    <script type="module" crossorigin src="./assets/index-CPWlRp5g.js"></script>
  </head>
  <body>
    <header>
      <h1>Creo</h1>
      <span id="status">Ready</span>
      <span class="grow"></span>
      <input id="token" placeholder="access token (blank in --insecure)" />
    </header>
    <main>
      <section id="chat">
        <div id="log">
          <div class="msg creo">Tell me about the website you'd like — what it's for, who it's for, and any details you have.</div>
        </div>
        <div id="composer">
          <textarea id="input" placeholder="e.g. A site for my bakery with a menu and opening hours"></textarea>
          <button id="send">Send</button>
        </div>
      </section>
      <section id="preview-pane">
        <div id="preview-bar">
          <button id="publish" disabled>Publish</button>
          <a id="live" href="#" target="_blank"></a>
          <span class="grow"></span>
          <span>Live preview</span>
        </div>
        <div id="preview-body">
          <div id="preview-overlay">Building your site…</div>
          <iframe id="preview" title="Live preview"></iframe>
        </div>
      </section>
    </main>
  </body>
</html>
